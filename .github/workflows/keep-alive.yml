# Supabase keep-alive
#
# The free Supabase tier pauses a project after ~7 days with no database
# activity. A paused project means the first visitor after a quiet week
# hits a dead site until someone manually un-pauses it in the dashboard.
# This workflow sends a tiny read request to the database every 3 days so
# it never goes idle long enough to be paused.
#
# Requires two repository secrets (Settings → Secrets and variables →
# Actions), NOT the VITE_-prefixed ones used by the app build:
#   SUPABASE_URL        e.g. https://xxxxx.supabase.co
#   SUPABASE_ANON_KEY    the project's anon/public API key
#
# GitHub disables scheduled workflows after 60 days of repository
# inactivity (no pushes/commits) — re-enable it from the Actions tab if
# that happens.

name: Supabase keep-alive

on:
  schedule:
    - cron: "0 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl --fail --silent --show-error \
            "${SUPABASE_URL}/rest/v1/news?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}"
